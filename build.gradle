plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation (
            'org.junit.jupiter:junit-jupiter:5.11.1',
            'com.codeborne:selenide:7.12.1',
            'commons-io:commons-io:2.11.0',
            "com.codeborne:pdf-test:1.7.0"
    )
}

test {
    useJUnitPlatform()
}