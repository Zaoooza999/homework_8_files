plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation (
            'org.junit.jupiter:junit-jupiter:5.11.1',
            'com.codeborne:selenide:7.12.1',
            'commons-io:commons-io:2.11.0',
            "com.codeborne:pdf-test:1.7.0",
            "com.codeborne:selenide-proxy:7.12.1",
            'com.codeborne:xls-test:1.7.2',
            'com.opencsv:opencsv:5.12.0',
            'com.google.code.gson:gson:2.13.2',
            'com.fasterxml.jackson.core:jackson-databind:2.21.2'
    )
    testImplementation 'org.apache.poi:poi:5.3.0'
    testImplementation 'org.apache.poi:poi-ooxml:5.3.0'
    testImplementation 'org.assertj:assertj-core:3.27.1'
}

test {
    useJUnitPlatform()
}